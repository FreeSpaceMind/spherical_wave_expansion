[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swe"
version = "0.1.0"
description = "Spherical wave expansion analysis for electromagnetic fields"
authors = [{name = "Justin Long", email = "justinwlong1@gmail.com"}]
requires-python = ">=3.9"
license = {text = "MIT"}

keywords = ["spherical", "wave", "expansion", "antenna", "electromagnetic", "near-field"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "matplotlib>=3.3.0",
]

[tool.setuptools]
packages = ["swe"]

[tool.black]
line-length = 100
target-version = ['py39']
